name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/ucmercedrobotics/gpt-mission-planner/issues) first to avoid duplicates.
        **Do not paste API keys or the contents of your `.env` file.**

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the mission prompt you used, if relevant.
      placeholder: |
        1. Run `make prod`
        2. Open http://localhost:8002
        3. Enter mission prompt "..."
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include generated XML/LTL output if relevant.
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Web UI (make prod)
        - CLI
        - Devcontainer
        - Other
    validations:
      required: true

  - type: dropdown
    id: routing
    attributes:
      label: LLM routing mode
      description: Value of `llm.routing.mode` in your config.
      options:
        - online
        - offline
        - auto
        - Not sure
    validations:
      required: true

  - type: input
    id: models
    attributes:
      label: Models used
      placeholder: e.g. gpt-5 for XML, claude-sonnet for LTL
    validations:
      required: false

  - type: checkboxes
    id: features
    attributes:
      label: Features enabled
      options:
        - label: Formal verification (LTL / SPIN)
        - label: Fleet control
        - label: Speech-to-text (Whisper)
        - label: Connected to a real robot

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or output of `git rev-parse --short HEAD`.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Ubuntu 22.04, Docker 27.1, Python 3.11
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output (see the `logs/` directory). This will be formatted as code automatically.
      render: shell
    validations:
      required: false
