logging:
  level: DEBUG

auth:
  token_env_file: ".env"

planner:
  retries:
    max: 10
  generation:
    max_tokens: 4096
    reasoning_effort: high
  validation:
    lint_xml: true
    ltl_enabled: true
  formal_verification:
    promela_template: "app/resources/context/formal_verification/promela_template.txt"
    spin_path: "spin"
    human_review: false
    example_runs: 5

llm:
  routing:
    mode: online
    online_model: "openai/gpt-5.2"
    ltl:
      online_model: null
      offline_model: null
    arbiter:
      online_model: "claude-sonnet-4-20250514"
      offline_model: null
  endpoints:
    online_api_base: null
    offline_api_base: null

mission:
  log_directory: "./app/gpt_outputs/iros_experiments/4o"
  schema_paths:
    - "schemas/clearpath_husky.xsd"
  context_files:
    - "./app/resources/context/sites/reza/geojson/reza_small.geojson"
  farm:
    polygon_file: "farm_polygons/reza_medium.yaml"

network:
  tcp:
    host: 172.17.0.1
    port: 12346

fleet:
  enabled: false
  discovery:
    host: "0.0.0.0"
    port: 8003
    heartbeat_ttl_s: 15
    stale_after_s: 8
  auth_token: null
  registry_file: "logs/robots.json"
  static_robots: []
  allocation:
    require_idle: true
    min_battery_pct: 0.2
    max_robots_per_mission: 4
