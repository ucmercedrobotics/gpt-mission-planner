logging:
  level: DEBUG

auth:
  token_env_file: ".env"

planner:
  retries:
    max: 10
  generation:
    max_tokens: 10000
    temperature: 0.2
  validation:
    lint_xml: true
    ltl_enabled: false
  formal_verification:
    promela_template: "app/resources/context/formal_verification/promela_template.txt"
    spin_path: "spin"

llm:
  routing:
    # supported modes: auto, online, offline
    mode: online
    online_model: "openai/gpt-5.6-sol"
    offline_model: "hosted_vllm/openai/gpt-oss-120b"
  endpoints:
    online_api_base: null
    offline_api_base: "http://172.17.0.1:8000/v1"

mission:
  log_directory: "./app/gpt_outputs/icra2027"
  schema_paths:
    - "schemas/amiga_btcpp.xsd"
  context_files:
    - "./app/resources/context/prompts/mission_planner/wheeled/orchard.j2"
    - "./app/resources/context/prompts/mission_planner/manipulators/kinova.txt"
  farm:
    polygon_file: "farm_polygons/gazebo.yaml"

network:
  # Legacy single-robot target. Used when fleet.enabled is false, or when the
  # fleet is enabled but no robot has reported in.
  tcp:
    host: 172.17.0.1
    port: 12346

fleet:
  enabled: true
  discovery:
    # Robots POST to http://<planner>:<port>/robots/register and then heartbeat.
    host: "0.0.0.0"
    port: 8003
    # No heartbeat within stale_after_s -> skipped for new work.
    # No heartbeat within heartbeat_ttl_s -> treated as offline.
    heartbeat_ttl_s: 15
    stale_after_s: 8
  # Set to require an X-Fleet-Token header on every discovery call.
  auth_token: null
  registry_file: "logs/robots.json"
  # Bench robots that cannot self-register. Always treated as online.
  static_robots: []
  allocation:
    require_idle: true
    min_battery_pct: 0.2
    max_robots_per_mission: 4
